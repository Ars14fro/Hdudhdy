    <style>  
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');  
      
    body {  
        font-family: 'Inter', sans-serif;  
        overflow-x: hidden;  
        /* Prevent bounce on mobile */  
        overscroll-behavior-y: none;  
    }  

    /* 3D Canvas Overlay */  
    #canvas-container {  
        position: fixed;   
        top: 0;  
        left: 0;  
        width: 100vw;  
        height: 100vh;  
        pointer-events: none;   
        z-index: 40; /* Lower than UI but higher than BG */  
        opacity: 0;  
        transition: opacity 0.5s ease;  
    }  
      
    #canvas-container.active {  
        opacity: 1;  
    }  

    /* Animations */  
    @keyframes popUp {  
        0% { transform: scale(0) translateY(100px); opacity: 0; }  
        50% { transform: scale(1.2) translateY(-20px); opacity: 1; }  
        100% { transform: scale(1) translateY(0); opacity: 1; }  
    }  

    .sad-face-anim {  
        animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;  
    }  

    @keyframes fadeInScale {  
        0% { opacity: 0; transform: scale(0.8); }  
        100% { opacity: 1; transform: scale(1); }  
    }  

    .result-overlay-anim {  
        animation: fadeInScale 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;  
    }  

    /* Custom Scrollbar */  
    ::-webkit-scrollbar { width: 6px; }  
    ::-webkit-scrollbar-track { background: transparent; }  
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }  
    .dark ::-webkit-scrollbar-thumb { background: #475569; }  

    .dice-card { transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }  
    .dice-card:hover { transform: translateY(-5px); }  

    /* Mobile safe area adjustments */  
    .safe-pb { padding-bottom: env(safe-area-inset-bottom); }  
    
    /* Chat animations */
    @keyframes slideInRight {
        0% { transform: translateX(100%); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
    }
    
    .chat-message-slide {
        animation: slideInRight 0.3s ease-out forwards;
    }
</style>  
<script>

    <div id="root" class="flex-grow flex flex-col"></div>  
    <script type="text/babel">  
    const { useState, useEffect, useRef } = React;  

    // --- Localization ---  
    const translations = {  
        ru: {  
            nav_game: "Игра",  
            nav_about: "Об авторах",  
            select_dice: "Выберите тип",

            roll_btn: "БРОСИТЬ",

            total: "Сумма",  
            history: "История",  
            clear_history: "Очистить",  
            team_title: "Команда",  
            roles: { frontend: "Frontend Разработчик", backend: "Backend Разработчик", design: "UI/UX Дизайнер", lead: "Team Lead" },  
            motto: "Бросай реальность. Играй в цифру.",

            chat: "Чат",

            send: "Отправить",
            chat_empty: "Сообщений пока нет",
            chat_connected: "подключился к чату",
            typing: "печатает...",
            empty_history: "История пуста",
            wait: "Нажмите БРОСИТЬ"
        },  
        en: {  
            nav_game: "Game",  
            nav_about: "About",  
            select_dice: "Select Dice",  
            dice_count: "Count",  
            roll_btn: "ROLL DICE",  
            rolling: "Rolling...",  
            total: "Total",  
            history: "History",  
            clear_history: "Clear",  
            team_title: "Team",  
            roles: { frontend: "Frontend Dev", backend: "Backend Dev", design: "UI/UX Designer", lead: "Team Lead" },  
            motto: "Roll reality. Play digital.",  
            settings: "Settings",  
            crit_success: "CRITICAL SUCCESS!",  
            crit_fail: "CRITICAL FAILURE...",  
            mp_room: "Online Room",  
            nickname: "Your Nickname",  
            host: "Host Room",  
            join: "Join Room",  
            room_id: "Room ID",  
            friend_id: "Friend ID",  
            copy: "Copy",  
            connected_to: "Connected to",  
            waiting: "Waiting for player...",  
            player_rolled: "rolled",  
            synced: "Syncing...",
            chat: "Chat",
            chat_placeholder: "Type a message...",
            send: "Send",
            chat_empty: "No messages yet",
            chat_connected: "joined the chat",
            typing: "is typing...",
            empty_history: "History is empty",
            wait: "Press ROLL DICE"
        }  
    };  

    // --- 3D SCENE COMPONENT ---  
    const ThreeDiceScene = ({ active, type, count, onAnimationComplete }) => {  
        const containerRef = useRef(null);  
        const requestRef = useRef(null);  
        const sceneRef = useRef(null);  

        useEffect(() => {  
            if (!active) return;  

            // 1. Setup Scene  
            const scene = new THREE.Scene();  
            sceneRef.current = scene;  
              
            // Adjust camera for mobile/desktop  
            const isMobile = window.innerWidth < 768;  
            const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);  
            camera.position.z = isMobile ? 18 : 15;  

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });  
            renderer.setSize(window.innerWidth, window.innerHeight);  
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimise performance  
              
            if (containerRef.current) {  
                containerRef.current.innerHTML = '';  
                containerRef.current.appendChild(renderer.domElement);  
            }  

            // 2. Lighting  
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);  
            scene.add(ambientLight);  
              
            const pointLight = new THREE.PointLight(0x6366f1, 1.2);  
            pointLight.position.set(10, 10, 10);  
            scene.add(pointLight);  

            const pointLight2 = new THREE.PointLight(0xec4899, 1.2);  
            pointLight2.position.set(-10, -10, 10);  
            scene.add(pointLight2);  

            // 3. Create Dice Meshes  
            const meshes = [];  
              
            let geometry;  
            switch(type) {  
                case 'd4': geometry = new THREE.TetrahedronGeometry(1.5); break;  
                case 'd6': geometry = new THREE.BoxGeometry(2, 2, 2); break;  
                case 'd8': geometry = new THREE.OctahedronGeometry(1.5); break;  
                case 'd10': geometry = new THREE.OctahedronGeometry(1.5); break;  
                case 'd12': geometry = new THREE.DodecahedronGeometry(1.5); break;  
                case 'd20': geometry = new THREE.IcosahedronGeometry(1.5); break;  
                case 'd100': geometry = new THREE.IcosahedronGeometry(1.5, 1); break;  
                default: geometry = new THREE.BoxGeometry(2, 2, 2);  
            }  

            const material = new THREE.MeshStandardMaterial({   
                color: 0x1e293b,   
                roughness: 0.2,   
                metalness: 0.6   
            });  
            const wireframeMaterial = new THREE.LineBasicMaterial({ color: 0xec4899 });  

            const visualCount = Math.min(count, 15);  

            for (let i = 0; i < visualCount; i++) {  
                const group = new THREE.Group();  
                  
                const mesh = new THREE.Mesh(geometry, material);  
                const edges = new THREE.EdgesGeometry(geometry);  
                const line = new THREE.LineSegments(edges, wireframeMaterial);  
                  
                group.add(mesh);  
                group.add(line);  

                // FIX: Constrain spread to avoid flying off screen  
                const spread = isMobile ? 3 : 6;  
                group.position.x = (Math.random() - 0.5) * spread;  
                group.position.y = (Math.random() - 0.5) * spread;  
                group.position.z = (Math.random() - 0.5) * 4;  

                // Random rotation speeds  
                group.userData = {  
                    rotX: (Math.random() * 0.15) + 0.05,  
                    rotY: (Math.random() * 0.15) + 0.05,  
                };  

                scene.add(group);  
                meshes.push(group);  
            }  

            // 4. Animation Loop  
            let frame = 0;  
            const animate = () => {  
                frame++;  
                meshes.forEach((mesh, idx) => {  
                    mesh.rotation.x += mesh.userData.rotX;  
                    mesh.rotation.y += mesh.userData.rotY;  
                    mesh.position.y += Math.sin(frame * 0.05 + idx) * 0.02;   
                });  
                  
                renderer.render(scene, camera);  
                requestRef.current = requestAnimationFrame(animate);  
            };  

            animate();  

            // 5. Finish  
            const timer = setTimeout(() => {  
                cancelAnimationFrame(requestRef.current);  
                if (onAnimationComplete) onAnimationComplete();  
            }, 1500); // 1.5 seconds spin  

            const handleResize = () => {  
                camera.aspect = window.innerWidth / window.innerHeight;  
                camera.updateProjectionMatrix();  
                renderer.setSize(window.innerWidth, window.innerHeight);  
            };  
            window.addEventListener('resize', handleResize);  

            // --- FIXED CLEANUP FUNCTION (WAS CAUSING CRASH) ---
            return () => {  
                clearTimeout(timer);  
                // FIXED: Typos 'requestRequest' -> 'requestRef'
                if (requestRef.current) {
                    cancelAnimationFrame(requestRef.current);  
                }
                window.removeEventListener('resize', handleResize);  
                if (containerRef.current && containerRef.current.contains(renderer.domElement)) {  
                    containerRef.current.removeChild(renderer.domElement);  
                }  
                geometry.dispose();  
                material.dispose();  
                renderer.dispose();
            };  

        }, [active, type, count]);  

        return <div id="canvas-container" className={active ? 'active' : ''} ref={containerRef}></div>;  
    };  

    // --- Chat Component ---
    const Chat = ({ messages, onSendMessage, isConnected, nickname, connectedPlayerName, lang, onTyping }) => {
        const [message, setMessage] = useState('');
        const [isTyping, setIsTyping] = useState(false);
        const messagesEndRef = useRef(null);
        const typingTimeoutRef = useRef(null);
        const t = translations[lang];
        
        const scrollToBottom = () => {
            messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
        };
        
        useEffect(() => {
            scrollToBottom();
        }, [messages]);
        
        const handleSend = () => {
            if (message.trim() && onSendMessage) {
                onSendMessage(message.trim());
                setMessage('');
                setIsTyping(false);
                if (typingTimeoutRef.current) {
                    clearTimeout(typingTimeoutRef.current);
                }
            }
        };
        
        const handleKeyPress = (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        };
        
        const handleInputChange = (e) => {
            setMessage(e.target.value);
            
            // Notify about typing
            if (e.target.value && !isTyping) {
                setIsTyping(true);
                onTyping(true);
            }
            
            // Clear existing timeout
            if (typingTimeoutRef.current) {
                clearTimeout(typingTimeoutRef.current);
            }
            
            // Set timeout to stop typing indicator
            typingTimeoutRef.current = setTimeout(() => {
                setIsTyping(false);
                onTyping(false);
            }, 1000);
        };
        
        return (
            <div className="flex flex-col h-full bg-white dark:bg-cardDark rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">
                <div className="p-4 border-b border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 flex-shrink-0">
                    <div className="flex items-center gap-2 font-bold text-slate-700 dark:text-slate-200">
                        <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                            <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                        </svg>
                        {t.chat}
                    </div>
                    {isConnected && (
                        <div className="text-xs text-slate-500 mt-1 truncate">
                            {connectedPlayerName ? `${t.connected_to} ${connectedPlayerName}` : t.waiting}
                        </div>
                    )}
                </div>
                
                <div className="flex-grow overflow-y-auto p-4 space-y-3 custom-scrollbar">
                    {messages.length === 0 ? (
                        <div className="text-center py-8 text-slate-400 text-sm">
                            {t.chat_empty}
                        </div>
                    ) : (
                        messages.map((msg, idx) => (
                            <div 
                                key={idx} 
                                className={`p-3 rounded-xl max-w-[85%] ${
                                    msg.isMine 
                                        ? 'bg-primary text-white ml-auto rounded-br-none' 
                                        : 'bg-slate-100 dark:bg-slate-800 rounded-bl-none'
                                } chat-message-slide`}
                            >
                                <div className="text-xs font-semibold opacity-80 mb-1 truncate">
                                    {msg.player}
                                </div>
                                <div className="text-sm break-words">{msg.text}</div>
                                <div className={`text-xs mt-1 ${msg.isMine ? 'text-blue-100' : 'text-slate-500'}`}>
                                    {msg.time}
                                </div>
                            </div>
                        ))
                    )}
                    <div ref={messagesEndRef} />
                </div>
                
                <div className="p-3 border-t border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 flex-shrink-0">
                    <div className="flex gap-2">
                        <input
                            type="text"
                            value={message}
                            onChange={handleInputChange}
                            onKeyPress={handleKeyPress}
                            placeholder={t.chat_placeholder}
                            disabled={!isConnected}
                            className="flex-1 min-w-0 px-3 py-2 rounded-lg border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary outline-none disabled:opacity-50"
                        />
                        <button
                            onClick={handleSend}
                            disabled={!message.trim() || !isConnected}
                            className="bg-primary text-white px-4 py-2 rounded-lg font-bold text-sm hover:bg-indigo-600 disabled:opacity-50 disabled:cursor-not-allowed transition-colors whitespace-nowrap flex-shrink-0"
                        >
                            {t.send}
                        </button>
                    </div>
                </div>
            </div>
        );
    };

    // --- Main App Component ---  
    const App = () => {  
        const [lang, setLang] = useState('ru');  
        const [theme, setTheme] = useState('dark');  
        const [page, setPage] = useState('game');   
        const [soundEnabled, setSoundEnabled] = useState(true);  
          
        // Game State  
        const [selectedDice, setSelectedDiceState] = useState('d6'); // Use wrapper for updates  
        const [count, setCountState] = useState(1); // Use wrapper for updates  
        const [isRolling, setIsRolling] = useState(false);  
        const [show3D, setShow3D] = useState(false);  
        const [results, setResults] = useState([]);  
        const [history, setHistory] = useState([]);  
          
        // Effects  
        const [effectState, setEffectState] = useState('none');  
        const [remoteResultOverlay, setRemoteResultOverlay] = useState(null); // { player, total, vals }  

        // Multiplayer State  
        const [nickname, setNickname] = useState('');  
        const [peerId, setPeerId] = useState(null);  
        const [remoteId, setRemoteId] = useState('');  
        const [connStatus, setConnStatus] = useState('disconnected'); // disconnected, waiting, connected  
        const [connectedPlayerName, setConnectedPlayerName] = useState('');  
          
        // Chat State
        const [messages, setMessages] = useState([]);
        const [isTyping, setIsTyping] = useState(false);
        const [remoteTyping, setRemoteTyping] = useState(false);
          
        const audioCtxRef = useRef(null);  
        const peerRef = useRef(null);  
        const connRef = useRef(null);  
        const typingTimeoutRef = useRef(null);
        const t = translations[lang];  

        useEffect(() => {  
            const root = window.document.documentElement;  
            if (theme === 'dark') root.classList.add('dark');  
            else root.classList.remove('dark');  
        }, [theme]);  

        // --- AUDIO ---  
        const initAudio = () => {  
            if (!soundEnabled) return;  
            if (!audioCtxRef.current) {  
                const AudioContext = window.AudioContext || window.webkitAudioContext;  
                audioCtxRef.current = new AudioContext();  
            }  
            if (audioCtxRef.current.state === 'suspended') {  
                audioCtxRef.current.resume();  
            }  
        };  

        const playSound = (freq, type = 'sine', duration = 0.1, time = 0) => {  
            if (!soundEnabled) return;  
            initAudio();  
            const ctx = audioCtxRef.current;  
            if(!ctx) return;  
            const osc = ctx.createOscillator();  
            const gain = ctx.createGain();  
            osc.type = type;  
            osc.frequency.setValueAtTime(freq, ctx.currentTime + time);  
            gain.gain.setValueAtTime(0.3, ctx.currentTime + time);  
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + time + duration);  
            osc.connect(gain);  
            gain.connect(ctx.destination);  
            osc.start(ctx.currentTime + time);  
            osc.stop(ctx.currentTime + time + duration);  
        };  

        const playMelody = (notes) => {  
            notes.forEach(n => playSound(n.freq, n.type || 'sine', n.duration || 0.2, n.delay || 0));  
        };  

        // --- LOGIC ---  
        const getDieMax = (type) => parseInt(type.substring(1));  

        // WRAPPERS for Syncing Settings  
        const changeDiceType = (type, broadcast = true) => {  
            setSelectedDiceState(type);  
            if(broadcast && connRef.current && connRef.current.open) {  
                connRef.current.send({ type: 'SYNC_SETTINGS', dice: type, count: count });  
            }  
        };  

        const changeCount = (newCount, broadcast = true) => {  
            const safeCount = Math.max(1, Math.min(20, newCount));  
            setCountState(safeCount);  
            if(broadcast && connRef.current && connRef.current.open) {  
                connRef.current.send({ type: 'SYNC_SETTINGS', dice: selectedDice, count: safeCount });  
            }  
        };  

        const startRoll = () => {  
            if(isRolling) return;  
            initAudio();  
            setIsRolling(true);  
            setShow3D(true);  
            setResults([]);  
            setEffectState('none');  
            setRemoteResultOverlay(null);  
              
            if (navigator.vibrate) navigator.vibrate(50);  
              
            // Sound effect  
            let i = 0;  
            const interval = setInterval(() => {  
                playSound(200 + Math.random() * 100, 'triangle', 0.1);  
                i++;  
                if(i>8) clearInterval(interval);  
            }, 150);  
        };  

        const finishRoll = () => {  
            const maxDieValue = getDieMax(selectedDice);  
              
            // Random Logic  
            const randomBuffer = new Uint32Array(count);  
            if (typeof window.crypto !== 'undefined' && window.crypto.getRandomValues) {  
                window.crypto.getRandomValues(randomBuffer);  
            } else {  
                for(let i = 0; i < count; i++) randomBuffer[i] = Math.floor(Math.random() * 4294967296);  
            }  
              
            const newResults = Array.from({ length: count }, (_, i) => (randomBuffer[i] % maxDieValue) + 1);  
            const total = newResults.reduce((a, b) => a + b, 0);  

            // Update Local State  
            setResults(newResults);  
            setShow3D(false);  
            setIsRolling(false);  
              
            handleEffects(total, count, maxDieValue);  

            // Add to History locally  
            const historyItem = {  
                id: Date.now(),  
                player: nickname || 'Я', // Local player name  
                type: selectedDice,  
                count: count,  
                total: total,  
                vals: newResults,  
                time: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),  
                isMine: true  
            };  

            setHistory(prev => [historyItem, ...prev].slice(0, 30));  

            // BROADCAST TO PEER  
            if (connRef.current && connRef.current.open) {  
                connRef.current.send({  
                    type: 'ROLL_RESULT',  
                    player: nickname || 'Игрок',  
                    diceType: selectedDice,  
                    count: count,  
                    vals: newResults,  
                    total: total  
                });  
            }  
        };  

        const handleEffects = (total, cnt, max) => {  
             if (total === cnt * max) {  
                playMelody([{freq: 523, delay: 0}, {freq: 659, delay: 0.1}, {freq: 783, delay: 0.2}, {freq: 1046, delay: 0.3, duration: 0.5}]);  
                confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });  
            } else if (total === cnt) {  
                setEffectState('sad');  
                playMelody([{freq: 466, delay: 0}, {freq: 440, delay: 0.3}, {freq: 392, delay: 0.6, duration: 0.8}]);  
                setTimeout(() => setEffectState('none'), 3000);  
            } else {  
                playSound(600, 'sine', 0.3);  
            }  
        };  

        // --- CHAT FUNCTIONS ---
        const sendMessage = (text) => {
            if (!text.trim()) return;
            
            const newMessage = {
                player: nickname || 'Я',
                text: text,
                time: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),
                isMine: true
            };
            
            setMessages(prev => [...prev, newMessage].slice(0, 100));
            
            // Send to peer
            if (connRef.current && connRef.current.open) {
                connRef.current.send({
                    type: 'CHAT_MESSAGE',
                    message: newMessage
                });
            }
            
            // Play notification sound
            playSound(800, 'sine', 0.1);
        };
        
        const handleTyping = (typing) => {
            setIsTyping(typing);
            
            // Send typing status to peer
            if (connRef.current && connRef.current.open) {
                connRef.current.send({
                    type: 'TYPING_STATUS',
                    typing: typing
                });
            }
        };

        // --- PEER JS INTEGRATION ---  
        const initializePeer = () => {  
            if(!nickname) return alert("Пожалуйста, введите никнейм!");  
              
            const peer = new Peer(); // Auto generate ID  
            peerRef.current = peer;  

            peer.on('open', (id) => {  
                setPeerId(id);  
                setConnStatus('waiting');  
            });  

            peer.on('connection', (connection) => {  
                setupConnection(connection);  
            });  

            peer.on('error', (err) => {  
                console.error(err);  
                alert("Ошибка соединения: " + err.type);  
            });  
        };  

        const joinGame = () => {  
            if(!nickname) return alert("Введите никнейм!");  
            if(!remoteId) return alert("Введите ID друга!");  
              
            if (peerRef.current) peerRef.current.destroy();  
              
            const peer = new Peer();  
            peerRef.current = peer;  
              
            peer.on('open', () => {  
                setPeerId(peer.id);  
                const connection = peer.connect(remoteId, {  
                    metadata: { name: nickname }  
                });  
                setupConnection(connection);  
            });  
              
            peer.on('error', (err) => alert("Ошибка: " + err.type));  
        };  

        const setupConnection = (conn) => {  
            connRef.current = conn;  

            conn.on('open', () => {  
                setConnStatus('connected');  
                // Send my nickname  
                conn.send({ type: 'HANDSHAKE', name: nickname, dice: selectedDice, count: count });  
                
                // Add connection message to chat
                const connectionMessage = {
                    player: 'Система',
                    text: `${nickname} ${t.chat_connected}`,
                    time: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),
                    isMine: false,
                    isSystem: true
                };
                setMessages(prev => [...prev, connectionMessage]);
            });  

            conn.on('data', (data) => {  
                handleIncomingData(data);  
            });  

            conn.on('close', () => {  
                setConnStatus('disconnected');  
                setConnectedPlayerName('');  
                alert("Игрок отключился");  
            });  
        };  

        const handleIncomingData = (data) => {  
            // Settings Sync  
            if(data.type === 'SYNC_SETTINGS') {  
                // Update without broadcasting back  
                changeDiceType(data.dice, false);  
                changeCount(data.count, false);  
            }  
              
            // Roll Result  
            if(data.type === 'ROLL_RESULT') {  
                // Show BIG overlay  
                setRemoteResultOverlay({  
                    player: data.player,  
                    total: data.total,  
                    vals: data.vals  
                });  

                // Add to History  
                setHistory(prev => [{  
                    id: Date.now(),  
                    player: data.player,  
                    type: data.diceType,  
                    count: data.count,  
                    total: data.total,  
                    vals: data.vals,  
                    time: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),  
                    isMine: false  
                }, ...prev].slice(0, 30));  

                // Hide overlay after delay  
                setTimeout(() => setRemoteResultOverlay(null), 4000);  
                  
                // Play notification sound  
                playSound(880, 'sine', 0.2);  
            }  

            // Handshake  
            if(data.type === 'HANDSHAKE') {  
                setConnectedPlayerName(data.name);  
                // Sync settings to match the person we joined, or prefer host?  
                // Let's adopt the sender's settings for sync  
                changeDiceType(data.dice, false);  
                changeCount(data.count, false);  
                  
                // Reply with my name if I just accepted a connection (I am host)  
                if(connStatus === 'waiting') {  
                    connRef.current.send({ type: 'HANDSHAKE_REPLY', name: nickname, dice: selectedDice, count: count });  
                }  
                alert(`Игрок ${data.name} подключился!`);  
                
                // Add connection message to chat
                const connectionMessage = {
                    player: 'Система',
                    text: `${data.name} ${t.chat_connected}`,
                    time: new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'}),
                    isMine: false,
                    isSystem: true
                };
                setMessages(prev => [...prev, connectionMessage]);
            }  

            if(data.type === 'HANDSHAKE_REPLY') {  
                 setConnectedPlayerName(data.name);  
                 // If I joined, I sync to host settings  
                 changeDiceType(data.dice, false);  
                 changeCount(data.count, false);  
            }  
            
            // Chat Message
            if(data.type === 'CHAT_MESSAGE') {
                setMessages(prev => [...prev, { ...data.message, isMine: false }].slice(0, 100));
                playSound(600, 'sine', 0.1);
            }
            
            // Typing Status
            if(data.type === 'TYPING_STATUS') {
                setRemoteTyping(data.typing);
                
                // Clear previous timeout
                if (typingTimeoutRef.current) {
                    clearTimeout(typingTimeoutRef.current);
                }
                
                // Auto-clear typing status after 2 seconds
                if (data.typing) {
                    typingTimeoutRef.current = setTimeout(() => {
                        setRemoteTyping(false);
                    }, 2000);
                }
            }
        };  

        // Icons  
        const Icons = {  
            Dices: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 8h.01"></path><path d="M8 8h.01"></path><path d="M8 16h.01"></path><path d="M16 16h.01"></path><path d="M12 12h.01"></path></svg>,  
            Users: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>,  
            History: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 3v5h5"></path><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"></path></svg>,  
            Trash: () => <svg className="w-3 h-3" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,  
            Sun: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>,  
            Moon: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>,  
            Wifi: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"></path><path d="M1.42 9a16 16 0 0 1 21.16 0"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>  
        };  

        const copyId = () => {  
            navigator.clipboard.writeText(peerId);  
            alert("ID скопирован!");  
        }  

        return (  
            <div className="relative w-full max-w-7xl mx-auto px-4 py-4 flex flex-col min-h-screen safe-pb">  
                  
                {/* SAD FACE OVERLAY */}  
                {effectState === 'sad' && (  
                    <div className="fixed inset-0 z-[60] flex items-center justify-center pointer-events-none">  
                        <div className="text-[120px] md:text-[200px] drop-shadow-2xl sad-face-anim filter grayscale">  
                            😢  
                        </div>  
                    </div>  
                )}  

                {/* REMOTE RESULT OVERLAY (FULL SCREEN) */}  
                {remoteResultOverlay && (  
                    <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-sm flex flex-col items-center justify-center result-overlay-anim p-4 text-center">  
                        <div className="text-white text-2xl md:text-4xl font-bold mb-4">  
                            {remoteResultOverlay.player} {t.player_rolled}:  
                        </div>  
                        <div className="text-[120px] md:text-[200px] font-black text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary drop-shadow-[0_0_30px_rgba(99,102,241,0.5)]">  
                            {remoteResultOverlay.total}  
                        </div>  
                        <div className="text-slate-400 text-xl font-mono mt-4">  
                            [ {remoteResultOverlay.vals.join(', ')} ]  
                        </div>  
                    </div>  
                )}  

                {/* 3D Overlay */}  
                <ThreeDiceScene active={show3D} type={selectedDice} count={count} onAnimationComplete={finishRoll} />  

                {/* Header */}  
                <header className="z-50 flex flex-col md:flex-row justify-between items-center mb-4 p-4 bg-white/90 dark:bg-cardDark/90 backdrop-blur-md rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm sticky top-2">  
                    <div className="flex items-center gap-3 cursor-pointer mb-3 md:mb-0 w-full md:w-auto justify-center md:justify-start" onClick={() => setPage('game')}>  
                        <div className="p-2 bg-gradient-to-tr from-primary to-secondary rounded-xl text-white shadow-lg shadow-primary/30">  
                            <Icons.Dices />  
                        </div>  
                        <div>  
                            <h1 className="text-xl md:text-2xl font-black tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">  
                                Dice Master 3D  
                            </h1>  
                        </div>  
                    </div>  

                    <div className="flex gap-2 w-full md:w-auto justify-center">  
                         <button onClick={() => setPage('game')} className={`px-4 py-2 rounded-lg font-bold text-sm transition-all ${page==='game' ? 'bg-slate-100 dark:bg-slate-700 text-primary' : 'hover:bg-slate-50 dark:hover:bg-slate-800'}`}>{t.nav_game}</button>  
                         <button onClick={() => setPage('about')} className={`px-4 py-2 rounded-lg font-bold text-sm transition-all ${page==='about' ? 'bg-slate-100 dark:bg-slate-700 text-primary' : 'hover:bg-slate-50 dark:hover:bg-slate-800'}`}>{t.nav_about}</button>  
                         <div className="w-px h-8 bg-slate-200 dark:bg-slate-700 mx-2"></div>  
                         <button onClick={() => setTheme(theme==='dark'?'light':'dark')} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800">{theme==='dark' ? <Icons.Sun/> : <Icons.Moon/>}</button>  
                         <button onClick={() => setLang(lang==='ru'?'en':'ru')} className="px-3 rounded-lg font-mono text-xs font-bold border border-slate-200 dark:border-slate-700">{lang.toUpperCase()}</button>  
                    </div>  
                </header>  

                {/* Main Content */}  
                <main className="flex-grow flex flex-col md:flex-row gap-6 relative z-10 pb-6">  
                      
                    {page === 'game' ? (  
                        <>  
                            <div className="flex-grow flex flex-col gap-4">  
                                  
                                {/* ONLINE LOBBY */}  
                                <div className="bg-indigo-50 dark:bg-slate-800/80 p-4 rounded-2xl border border-indigo-100 dark:border-slate-700">  
                                    <div className="flex items-center gap-2 mb-3 text-indigo-600 dark:text-indigo-400 font-bold text-sm uppercase tracking-wider">  
                                        <Icons.Wifi /> {t.mp_room}  
                                    </div>  
                                      
                                    {connStatus === 'disconnected' ? (  
                                        <div className="flex flex-col gap-3">  
                                            <input   
                                                type="text"   
                                                placeholder={t.nickname}  
                                                value={nickname}  
                                                onChange={(e) => setNickname(e.target.value)}  
                                                className="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm focus:ring-2 focus:ring-primary outline-none"  
                                            />  
                                            <div className="flex flex-col md:flex-row gap-2">  
                                                <button onClick={initializePeer} className="flex-1 bg-primary text-white py-2 rounded-xl font-bold text-sm hover:bg-indigo-600 shadow-md shadow-indigo-500/20">{t.host}</button>  
                                                <div className="flex flex-1 gap-2">  
                                                    <input   
                                                        type="text"   
                                                        placeholder={t.friend_id}  
                                                        value={remoteId}  
                                                        onChange={(e) => setRemoteId(e.target.value)}  
                                                        className="w-full px-3 py-2 rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 text-sm"  
                                                    />  
                                                    <button onClick={joinGame} className="bg-slate-700 text-white px-4 py-2 rounded-xl font-bold text-sm hover:bg-slate-600">OK</button>  
                                                </div>  
                                            </div>  
                                        </div>  
                                    ) : (  
                                        <div className="bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200 dark:border-slate-600 flex flex-col md:flex-row justify-between items-center gap-3">  
                                            <div className="flex items-center gap-2">  
                                                <div className="w-3 h-3 rounded-full bg-green-500 animate-pulse"></div>  
                                                <span className="font-bold text-sm">  
                                                    {connStatus === 'waiting' ? t.waiting : `${t.connected_to} ${connectedPlayerName}`}  
                                                </span>  
                                                {remoteTyping && (
                                                    <span className="text-xs text-slate-500 italic animate-pulse">
                                                        {connectedPlayerName} {t.typing}...
                                                    </span>
                                                )}
                                            </div>  
                                            {peerId && (  
                                                <div className="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1 rounded-lg">  
                                                    <span className="text-xs text-slate-500">{t.room_id}:</span>  
                                                    <code className="font-mono font-bold text-primary select-all">{peerId}</code>  
                                                    <button onClick={copyId} className="text-xs underline text-slate-400 hover:text-primary">{t.copy}</button>  
                                                </div>  
                                            )}  
                                        </div>  
                                    )}  
                                </div>  

                                {/* Dice Selector */}  
                                <div className="bg-white dark:bg-cardDark p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">  
                                    <div className="grid grid-cols-4 sm:grid-cols-7 gap-2 md:gap-3">  
                                        {['d4','d6','d8','d10','d12','d20','d100'].map(d => (  
                                            <button   
                                                key={d}   
                                                onClick={() => changeDiceType(d)}  
                                                className={`  
                                                    py-2 md:py-3 rounded-xl font-mono font-bold text-xs md:text-sm transition-all duration-200  
                                                    ${selectedDice === d   
                                                        ? 'bg-primary text-white shadow-lg shadow-primary/40 -translate-y-1'   
                                                        : 'bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700'}  
                                                `}  
                                            >  
                                                {d.toUpperCase()}  
                                            </button>  
                                        ))}  
                                    </div>  

                                    <div className="mt-4 md:mt-6 flex items-center justify-between bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-100 dark:border-slate-700">  
                                        <span className="text-sm font-bold text-slate-500 ml-2">{t.dice_count}</span>  
                                        <div className="flex items-center gap-3">  
                                            <button onClick={() => changeCount(count-1)} className="w-8 h-8 flex items-center justify-center rounded-lg bg-white dark:bg-slate-700 shadow-sm hover:scale-105 transition font-bold text-lg">-</button>  
                                            <span className="w-8 text-center font-black text-xl">{count}</span>  
                                            <button onClick={() => changeCount(count+1)} className="w-8 h-8 flex items-center justify-center rounded-lg bg-white dark:bg-slate-700 shadow-sm hover:scale-105 transition font-bold text-lg">+</button>  
                                        </div>  
                                    </div>  
                                </div>  

                                {/* Roll Area */}  
                                <div className="flex-grow relative flex flex-col items-center justify-center min-h-[250px] md:min-h-[300px] bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">  
                                      
                                    <div className="absolute top-0 left-0 w-64 h-64 bg-primary/10 rounded-full blur-[100px] pointer-events-none"></div>  
                                    <div className="absolute bottom-0 right-0 w-64 h-64 bg-secondary/10 rounded-full blur-[100px] pointer-events-none"></div>  

                                    {!isRolling && (  
                                        <div className="z-10 text-center w-full px-4">  
                                            {results.length > 0 ? (  
                                                <div className="animate-[fadeIn_0.5s_ease-out]">  
                                                    <div className="flex flex-wrap justify-center gap-3 mb-6">  
                                                        {results.map((res, idx) => (  
                                                            <div key={idx} className={`  
                                                                w-16 h-16 md:w-24 md:h-24 flex items-center justify-center rounded-2xl shadow-xl text-3xl md:text-4xl font-black  
                                                                ${res === getDieMax(selectedDice)   
                                                                    ? 'bg-gradient-to-br from-yellow-400 to-orange-500 text-white scale-110 ring-4 ring-yellow-400/30'   
                                                                    : res === 1   
                                                                        ? 'bg-slate-200 dark:bg-slate-800 text-slate-400 dark:text-slate-500 scale-95 ring-2 ring-red-500/20'  
                                                                        : 'bg-white dark:bg-slate-700 text-slate-800 dark:text-white'}  
                                                            `}>  
                                                                {res}  
                                                            </div>  
                                                        ))}  
                                                    </div>  
                                                    <div>  
                                                        <div className="text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">{t.total}</div>  
                                                        <div className="text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary">  
                                                            {results.reduce((a,b)=>a+b,0)}  
                                                        </div>  
                                                    </div>  
                                                      
                                                    {results.reduce((a,b)=>a+b,0) === count * getDieMax(selectedDice) && (  
                                                        <div className="mt-4 text-orange-500 font-black uppercase tracking-widest animate-pulse">{t.crit_success}</div>  
                                                    )}  
                                                    {results.reduce((a,b)=>a+b,0) === count && (  
                                                        <div className="mt-4 text-slate-400 font-black uppercase tracking-widest">{t.crit_fail}</div>  
                                                    )}  

                                                </div>  
                                            ) : (  
                                                <div className="text-slate-400 font-medium opacity-50">  
                                                    {t.wait}  
                                                </div>  
                                            )}  
                                        </div>  
                                    )}  
                                      
                                    {isRolling && (  
                                        <div className="z-10 text-2xl font-black text-white/20 animate-pulse uppercase tracking-[1em]">  
                                            Rolling  
                                        </div>  
                                    )}  
                                </div>  

                                {/* BIG BUTTON */}  
                                <button   
                                    onClick={startRoll}   
                                    disabled={isRolling}  
                                    className={`  
                                        w-full py-5 md:py-6 rounded-2xl text-xl font-black tracking-widest shadow-xl transition-all transform z-50

                                            ? 'bg-slate-200 dark:bg-slate-800 text-slate-400 scale-95 cursor-not-allowed'   
                                            : 'bg-gradient-to-r from-primary via-indigo-600 to-secondary text-white hover:shadow-primary/50 hover:-translate-y-1 active:scale-95'}

                                >  
                                    {isRolling ? t.rolling : t.roll_btn}

                            {/* Right Sidebar with History and Chat */}

                                {/* History Sidebar */}

                                            <div className="text-center py-10 text-slate-400 text-sm">{t.empty_history}</div>

                                            history.map(h => (

                                                    <div>  
                                                        <div className="flex items-center gap-2 mb-1">

                                                            <span className="text-xs font-mono text-slate-400">{h.time}</span>  
                                                        </div>  
                                                        <div className="flex items-center gap-2">  
                                                            <span className="text-xs font-bold bg-white dark:bg-slate-700 px-1.5 rounded text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600">{h.count}{h.type}</span>  
                                                            <div className="text-xs text-slate-500 truncate max-w-[90px]">  
                                                                [{h.vals.join(', ')}]  
                                                            </div>  
                                                        </div>  
                                                    </div>  
                                                    <div className={`text-2xl font-bold   
                                                        ${h.total === h.count * getDieMax(h.type) ? 'text-orange-500' :

                                                        {h.total}  
                                                    </div>  
                                                </div>  
                                            ))  
                                        )}  
                                    </div>  
                                </div>  
                                
                                {/* Chat Sidebar (Fixed Height Wrapper) */}  
                                <div className="h-[300px] md:h-[400px]">
                                    <Chat

                                        onSendMessage={sendMessage}
                                        isConnected={connStatus === 'connected'}
                                        nickname={nickname}
                                        connectedPlayerName={connectedPlayerName}

                    ) : (  
                        /* ABOUT PAGE */  
                        <div className="w-full h-full bg-white dark:bg-cardDark p-6 md:p-10 rounded-2xl border border-slate-200 dark:border-slate-700 animate-[fadeIn_0.5s]">
